[package]
name = "radio-on-air"
version = "0.1.0"
description = "Automação de rádio leve e open source para rádios comunitárias"
authors = ["Radio On Air"]
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
# O sufixo `_lib` evita conflito de nome entre a lib e o binário (necessário no Windows).
name = "radio_on_air_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
notify = "8"
rand = "0.9"
deunicode = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "pcm"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Decodificar áudio em modo debug é muito lento; otimiza só as dependências.
[profile.dev.package."*"]
opt-level = 2
