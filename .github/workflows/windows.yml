# Gera o instalador do Windows (Radio On Air_x.y.z_x64-setup.exe).
# Roda só quando alguém manda: aba Actions do GitHub → "Instalador Windows" →
# "Run workflow". O instalador fica para baixar no fim da execução (Artifacts).
name: Instalador Windows

on:
  workflow_dispatch:

env:
  LIQUIDSOAP_VERSAO: "2.4.6"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Guarda o que já compilou mesmo se algo falhar depois.
          cache-on-failure: true

      - name: Dependências do programa
        run: npm ci

      # O Liquidsoap (motor de som) vai dentro do instalador: quem instala não
      # precisa baixar mais nada.
      - name: Liquidsoap para Windows
        shell: pwsh
        run: |
          $v = $env:LIQUIDSOAP_VERSAO
          Invoke-WebRequest "https://github.com/savonet/liquidsoap/releases/download/v$v/liquidsoap-$v-win64.zip" -OutFile liquidsoap.zip
          Expand-Archive liquidsoap.zip -DestinationPath liquidsoap-zip
          $exe = Get-ChildItem liquidsoap-zip -Recurse -Filter liquidsoap.exe | Select-Object -First 1
          if (-not $exe) { throw "liquidsoap.exe não encontrado no zip" }
          New-Item -ItemType Directory -Force src-tauri/liquidsoap-win | Out-Null
          Copy-Item "$($exe.DirectoryName)/*" src-tauri/liquidsoap-win -Recurse -Force
          & src-tauri/liquidsoap-win/liquidsoap.exe --version
          & src-tauri/liquidsoap-win/liquidsoap.exe --list-portaudio-devices

      # Os testes conferem os scripts do motor e da gravação com o próprio
      # Liquidsoap de Windows (pega erro de script antes de instalar).
      - name: Testes
        working-directory: src-tauri
        env:
          RADIO_LIQUIDSOAP: ${{ github.workspace }}\src-tauri\liquidsoap-win\liquidsoap.exe
        run: cargo test --lib -- --nocapture

      - name: Gerar instalador
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
